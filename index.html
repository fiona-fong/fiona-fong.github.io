<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1714" />
  <meta name="format-detection" content="telephone=no" />
  <title>Fiona Fong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1714;
      --paper: #f3eee6;
      --card: #fffcf7;
      --muted: #6f675c;
      --line: #ddd4c6;
      --accent: #8f1d2c;
      --accent-dark: #6a121e;
      --gold: #b0894f;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Heiti TC", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .hidden { display: none !important; }

    header.top {
      position: sticky; top: 0; z-index: 20;
      background: rgba(243,238,230,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: max(10px, env(safe-area-inset-top)) 18px 10px;
    }
    .top-inner {
      max-width: 1080px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .brand {
      text-decoration: none; min-width: 140px;
    }
    .brand .name {
      font-family: "Noto Serif TC", serif;
      font-weight: 700; font-size: 20px; letter-spacing: .04em; line-height: 1.2;
    }
    .brand .tag { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
    nav.cats {
      display: flex; gap: 4px; flex: 1; flex-wrap: wrap; justify-content: center;
    }
    nav.cats a, nav.cats button.linkish {
      text-decoration: none; background: none; border: 0;
      padding: 8px 12px; min-height: 40px; color: var(--muted); font-weight: 700; font-size: 14px;
      border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0;
    }
    nav.cats a.on, nav.cats a:hover { color: var(--ink); border-bottom-color: var(--accent); }
    .top-actions { display: flex; gap: 8px; margin-left: auto; }
    .btn {
      appearance: none; border: 1px solid var(--ink); background: var(--ink); color: #fff;
      border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 800; font-size: 13px;
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn.ghost { background: transparent; color: var(--ink); }
    .btn.accent { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
    .btn.danger { background: #fff; color: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: .4; }
    body.editing .btn-edit { background: var(--accent); border-color: var(--accent-dark); color: #fff; }

    main.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 18px 80px; }
    .hero { padding: 18px 0 8px; }
    .hero h1 {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(36px, 8vw, 64px); line-height: 1.15; margin: 0 0 10px; font-weight: 700;
    }
    .hero p.lead { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.7; max-width: 40em; }
    .note {
      background: #fff7ea; border: 1px solid #ead9b8; color: #6a4e22;
      padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; line-height: 1.55; margin: 16px 0;
    }
    .sec-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 28px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px;
    }
    .sec-head h2 {
      margin: 0; font-family: "Noto Serif TC", serif; font-size: 22px; font-weight: 700;
    }
    .sec-head .num { color: var(--gold); font-family: "Noto Serif TC", serif; margin-right: 8px; }

    .cat-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 10px;
    }
    a.cat, .card.cat {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line); padding: 18px 16px 16px; min-height: 120px;
    }
    a.cat:hover { border-color: var(--ink); }
    a.cat .num, .card.cat .num { color: var(--gold); font-family: "Noto Serif TC", serif; font-size: 13px; letter-spacing: .16em; }
    a.cat h2, .card.cat h2 { margin: 10px 0 6px; font-family: "Noto Serif TC", serif; font-size: 24px; }
    a.cat p, .card.cat p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

    .work-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
    }
    a.work, .card.work {
      display: block; text-decoration: none; color: inherit; background: var(--card);
      border: 1px solid var(--line); overflow: hidden;
    }
    a.work:hover { border-color: var(--ink); }
    .cover {
      aspect-ratio: 3 / 2; background: #ddd4c6; overflow: hidden;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .meta { padding: 14px 14px 16px; }
    .kicker {
      font-size: 11px; letter-spacing: .14em; font-weight: 800; color: var(--accent); text-transform: uppercase;
    }
    .meta h2 {
      font-family: "Noto Serif TC", serif; font-size: 22px; margin: 6px 0 8px; line-height: 1.35;
    }
    .meta p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 800; background: #f3e1c8; color: #6a4e22;
      padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
    }

    .empty {
      border: 1px dashed var(--line); padding: 36px 16px; text-align: center;
      color: var(--muted); font-weight: 700; background: var(--card);
    }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .add-tile {
      appearance: none; display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--line); background: transparent; color: var(--muted);
      min-height: 120px; font-weight: 800; font-size: 15px; cursor: pointer;
      padding: 18px; text-align: center; width: 100%;
    }
    .add-tile:hover { border-color: var(--accent); color: var(--accent); }
    .work-grid .add-tile { min-height: 220px; }
    .body-tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; }
    .body-tools .btn { min-height: 36px; font-size: 12px; padding: 6px 12px; }

    article.story .hero-cover { margin: 0 0 22px; }
    article.story .hero-cover img { width: 100%; max-height: 70vh; object-fit: cover; }
    article.story .kicker { margin-bottom: 8px; }
    article.story h1 {
      font-family: "Noto Serif TC", serif; font-size: clamp(28px, 5vw, 44px);
      line-height: 1.25; margin: 0 0 10px;
    }
    article.story .by { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    article.story .body { font-size: 17px; line-height: 1.9; max-width: 42em; }
    article.story .body p { margin: 0 0 1em; }
    article.story .body h2 {
      font-family: "Noto Serif TC", serif; font-size: 22px; line-height: 1.4;
      margin: 1.6em 0 .7em;
    }
    figure.story-fig { margin: 22px 0 28px; max-width: 42em; }
    figure.story-fig img { width: 100%; cursor: pointer; }
    figure.story-fig figcaption { color: var(--muted); font-size: 14px; margin-top: 8px; line-height: 1.55; }
    figure.story-fig figcaption:empty { display: none; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 22px 0; }
    .gallery img, .thumbs img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
    .video-wrap { position: relative; padding-top: 56.25%; margin: 18px 0 24px; background: #000; }
    .video-wrap.square { padding-top: 100%; max-width: 42em; }
    .video-wrap iframe, .video-wrap video {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000;
    }
    .video-wrap video { object-fit: contain; }
    .outlink { margin: 18px 0; }

    body.editing .card { cursor: grab; }
    body.editing .card.dragging { opacity: .45; }
    body.editing .card.drag-over { outline: 2px dashed var(--accent); }
    .move-btns { display: none; gap: 8px; margin-top: 10px; padding: 0 14px 14px; }
    body.editing .move-btns { display: flex; }
    .move-btns button, .edit-tools button {
      flex: 1; min-height: 40px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-weight: 800; font-size: 13px;
    }
    .edit-label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); margin: 8px 0 4px; }
    .edit-title, .edit-blurb, .field {
      width: 100%; border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 1.45;
    }
    textarea.edit-blurb, textarea.field { min-height: 72px; resize: vertical; }
    textarea.body-field { min-height: 220px; }
    .form { background: var(--card); border: 1px solid var(--line); padding: 16px; margin-bottom: 18px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .thumb { position: relative; width: 112px; }
    .thumb img { height: 80px; }
    .thumb .x {
      position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: var(--accent); color: #fff; font-weight: 900;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(26,23,20,.55); z-index: 50;
      display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    }
    .sheet {
      background: var(--card); width: min(520px, 100%); border-radius: 16px 16px 8px 8px;
      padding: 18px 16px 20px; max-height: 90vh; overflow: auto;
    }
    .sheet h3 { margin: 0 0 12px; font-family: "Noto Serif TC", serif; }
    .sheet .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .sheet .row .btn { flex: 1; }

    .toast {
      position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
      background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px;
      font-weight: 800; text-align: center; z-index: 60;
    }
    .lb {
      position: fixed; inset: 0; background: rgba(0,0,0,.86); z-index: 70;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .lb img { max-width: 100%; max-height: 100%; object-fit: contain; }

    footer {
      text-align: center; color: var(--muted); font-size: 13px; padding: 8px 16px 28px; line-height: 1.6;
    }

    @media (max-width: 860px) {
      .cat-grid { grid-template-columns: 1fr 1fr; }
      .brand { order: 1; }
      .top-actions { order: 2; margin-left: auto; }
      nav.cats {
        order: 3; flex: 1 0 100%; width: 100%;
        justify-content: flex-start; overflow-x: auto;
        flex-wrap: nowrap; padding-bottom: 2px;
      }
    }
    @media (max-width: 640px) {
      .work-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 34px; }
      header.top { padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" id="brand">
        <div class="name" id="brandName">Fiona Fong</div>
        <div class="tag" id="brandTag">傳媒作品集</div>
      </a>
      <nav class="cats" id="nav"></nav>
      <div class="top-actions">
        <button class="btn ghost btn-edit" id="btnEdit" type="button">編輯</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <footer id="foot"></footer>
  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

  <script>
    const GH_DEFAULT = "fiona-fong/fiona-fong.github.io";
    let GH_REPO = GH_DEFAULT;
    let content = null;
    let editing = false;
    let ghToken = sessionStorage.getItem("ff-gh") || "";
    let dragId = null;
    let saveTimer = 0;

    const DEFAULT_CONTENT = {
      site: {
        name: "Fiona Fong",
        tagline: "傳媒作品集",
        about: "Fiona Fong，香港傳媒記者。",
        email: "", instagram: "", youtube: ""
      },
      categories: [
        { id: "project", title: "Project", blurb: "專題與企劃" },
        { id: "ad", title: "廣告", blurb: "品牌與廣告作品" },
        { id: "interview", title: "訪問", blurb: "人物專訪" },
        { id: "video", title: "影片", blurb: "影像作品" }
      ],
      works: []
    };

    function $(id) { return document.getElementById(id); }
    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function toast(msg) {
      document.querySelectorAll(".toast").forEach(n => n.remove());
      const n = document.createElement("div");
      n.className = "toast";
      n.textContent = msg;
      document.body.append(n);
      setTimeout(() => n.remove(), 2800);
    }
    function catById(id) { return (content.categories || []).find(c => c.id === id); }
    function workById(id) { return (content.works || []).find(w => w.id === id); }
    function worksIn(catId) { return (content.works || []).filter(w => w.category === catId); }
    function site() { return content.site || DEFAULT_CONTENT.site; }
    function pad(n) { return String(n).padStart(2, "0"); }

    function toastNow(msg) { toast(msg); }

    function bytesToB64(bytes) {
      let s = "";
      const arr = bytes instanceof Uint8Array ? bytes : new TextEncoder().encode(bytes);
      const chunk = 0x8000;
      for (let i = 0; i < arr.length; i += chunk) {
        s += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
      }
      return btoa(s);
    }

    async function deriveKey(pin, saltB64, iter) {
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, key, 256);
      return new Uint8Array(bits);
    }
    function xorBytes(data, key) {
      const out = new Uint8Array(data.length);
      for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
      return out;
    }
    async function encryptToken(pin, token) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const saltB64 = btoa(String.fromCharCode.apply(null, salt));
      const k = await deriveKey(pin, saltB64, 120000);
      const enc = xorBytes(new TextEncoder().encode(token), k);
      return {
        v: 1,
        salt: saltB64,
        iter: 120000,
        data: bytesToB64(enc),
        repo: GH_REPO
      };
    }
    async function decryptToken(pin, gate) {
      const k = await deriveKey(pin, gate.salt, gate.iter || 120000);
      const enc = Uint8Array.from(atob(gate.data), c => c.charCodeAt(0));
      const token = new TextDecoder().decode(xorBytes(enc, k)).replace(/\0+$/g, "").trim();
      if (!/^(gh[pous]_|github_pat_)/.test(token)) throw new Error("密碼不正確");
      return token;
    }

    async function ghGet(path) {
      const res = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        headers: { Authorization: "Bearer " + ghToken, Accept: "application/vnd.github+json" }
      });
      if (res.status === 404) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "讀取失敗");
      return data;
    }
    async function ghPut(path, textOrBytes, message) {
      if (!ghToken) throw new Error("尚未設定上網權限");
      const contentB64 = typeof textOrBytes === "string"
        ? bytesToB64(new TextEncoder().encode(textOrBytes))
        : bytesToB64(textOrBytes);
      const existing = await ghGet(path);
      const res = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + ghToken,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message || "更新作品集",
          content: contentB64,
          sha: existing && existing.sha,
          branch: "main"
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "儲存失敗");
      return data;
    }
    async function ghDel(path, message) {
      if (!ghToken) return;
      const existing = await ghGet(path);
      if (!existing) return;
      const res = await fetch("https://api.github.com/repos/" + GH_REPO + "/contents/" + path, {
        method: "DELETE",
        headers: {
          Authorization: "Bearer " + ghToken,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message || "刪除檔案", sha: existing.sha, branch: "main" })
      });
      if (!res.ok && res.status !== 404) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.message || "刪除失敗");
      }
    }

    function persistLocal() {
      localStorage.setItem("ff-content", JSON.stringify(content));
    }
    async function saveContent(msg) {
      persistLocal();
      if (!ghToken) {
        toast("已暫存在呢部裝置。要同步上網，請喺編輯入面設定 GitHub Token。");
        return;
      }
      const text = JSON.stringify(content, null, 2) + "\n";
      await ghPut("content.json", text, msg || "更新作品集");
      toast("已儲存");
    }
    function scheduleSave() {
      persistLocal();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveContent().catch(err => toast(err.message));
      }, 900);
    }

    function closeModal() { $("modal").classList.add("hidden"); }
    function openModal(html) {
      $("sheet").innerHTML = html;
      $("modal").classList.remove("hidden");
    }

    function videoEmbed(url) {
      const u = String(url || "").trim();
      if (!u) return "";
      let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
      if (m) return "https://www.youtube.com/embed/" + m[1];
      m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (m) return "https://player.vimeo.com/video/" + m[1];
      m = u.match(/facebook\.com\/.+\/videos\/\d+/);
      if (m) {
        const href = u.split("?")[0].replace(/\/$/, "") + "/";
        return "https://www.facebook.com/plugins/video.php?href=" + encodeURIComponent(href) + "&show_text=false&t=0";
      }
      return "";
    }
    function newId() {
      return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    }

    async function compressImage(file, max = 1600, quality = 0.82) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, w, h);
      const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", quality));
      const buf = await blob.arrayBuffer();
      return new Uint8Array(buf);
    }

    async function uploadImage(file, destPath) {
      const bytes = await compressImage(file);
      if (!ghToken) {
        const blob = new Blob([bytes], { type: "image/jpeg" });
        return URL.createObjectURL(blob);
      }
      await ghPut(destPath, bytes, "上傳相片 " + destPath);
      return destPath;
    }

    function lightbox(src) {
      const d = document.createElement("div");
      d.className = "lb";
      d.innerHTML = "<img alt=\"\" src=\"" + escapeHtml(src) + "\">";
      d.addEventListener("click", () => d.remove());
      document.body.append(d);
    }

    function hashParts() {
      const hash = (location.hash || "#/").replace(/^#/, "");
      return hash.split("/").filter(Boolean);
    }

    function setCategoryOrder(catId, ids) {
      const byId = Object.fromEntries(content.works.map(w => [w.id, w]));
      const nextCat = ids.map(id => byId[id]).filter(Boolean);
      content.works = content.categories.flatMap(c =>
        c.id === catId ? nextCat : content.works.filter(w => w.category === c.id)
      );
    }
    function shiftWork(id, dir) {
      const w = workById(id);
      if (!w) return;
      const ids = worksIn(w.category).map(x => x.id);
      const i = ids.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ids.length) return;
      const next = ids.slice();
      const [x] = next.splice(i, 1);
      next.splice(j, 0, x);
      setCategoryOrder(w.category, next);
    }
    function shiftCat(id, dir) {
      const ids = content.categories.map(c => c.id);
      const i = ids.indexOf(id);
      const j = i + dir;
      if (i < 0 || j < 0 || j >= ids.length) return;
      const next = content.categories.slice();
      const [x] = next.splice(i, 1);
      next.splice(j, 0, x);
      content.categories = next;
    }

    function moveButtons(kind, id, index, total) {
      if (!editing) return "";
      return `<div class="move-btns">
        <button type="button" data-kind="${kind}" data-id="${id}" data-move="-1" ${index === 0 ? "disabled" : ""}>上移</button>
        <button type="button" data-kind="${kind}" data-id="${id}" data-move="1" ${index === total - 1 ? "disabled" : ""}>下移</button>
      </div>`;
    }

    function bindMoves(root) {
      root.querySelectorAll("[data-move]").forEach(btn => {
        btn.addEventListener("click", async e => {
          e.preventDefault(); e.stopPropagation();
          const kind = btn.getAttribute("data-kind");
          const id = btn.getAttribute("data-id");
          const dir = Number(btn.getAttribute("data-move"));
          if (kind === "cat") shiftCat(id, dir);
          else shiftWork(id, dir);
          route();
          try { await saveContent("更新排版"); } catch (err) { toast(err.message); }
        });
      });
    }
    function bindDrag(root, kind) {
      if (!editing) return;
      root.querySelectorAll(".card[data-id]").forEach(card => {
        const id = card.getAttribute("data-id");
        card.setAttribute("draggable", "true");
        card.addEventListener("dragstart", e => {
          if (e.target.closest("input, textarea, button, label")) { e.preventDefault(); return; }
          dragId = id; card.classList.add("dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", () => { dragId = null; card.classList.remove("dragging"); });
        card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("drag-over"); });
        card.addEventListener("dragleave", () => card.classList.remove("drag-over"));
        card.addEventListener("drop", async e => {
          e.preventDefault(); card.classList.remove("drag-over");
          const toId = card.getAttribute("data-id");
          if (!dragId || dragId === toId) return;
          if (kind === "cat") {
            const ids = content.categories.map(c => c.id);
            const a = ids.indexOf(dragId), b = ids.indexOf(toId);
            if (a < 0 || b < 0) return;
            const next = content.categories.slice();
            const [x] = next.splice(a, 1);
            next.splice(b, 0, x);
            content.categories = next;
          } else {
            const w = workById(dragId);
            if (!w) return;
            const ids = worksIn(w.category).map(x => x.id);
            const a = ids.indexOf(dragId), b = ids.indexOf(toId);
            if (a < 0 || b < 0) return;
            const next = ids.slice();
            const [x] = next.splice(a, 1);
            next.splice(b, 0, x);
            setCategoryOrder(w.category, next);
          }
          route();
          try { await saveContent("更新排版"); } catch (err) { toast(err.message); }
        });
      });
    }

    function paragraphs(text) {
      const bits = String(text || "").split(/\n{2,}/);
      return bits.map(raw => {
        const p = String(raw || "").trim();
        const fig = p.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
        if (fig) {
          const cap = escapeHtml(fig[1]);
          const src = escapeHtml(fig[2]);
          return `<figure class="story-fig"><img src="${src}" alt="${cap}"><figcaption>${cap}</figcaption></figure>`;
        }
        const h = p.match(/^##\s+(.+)/);
        if (h) return `<h2>${escapeHtml(h[1])}</h2>`;
        return `<p>${escapeHtml(p).replace(/\n/g, "<br>")}</p>`;
      }).join("");
    }

    function renderMedia(w) {
      const src = String(w.video || "");
      if (/\.(mp4|webm|ogg)(\?|$)/i.test(src)) {
        const poster = w.cover ? ` poster="${escapeHtml(w.cover)}"` : "";
        return `<div class="video-wrap square"><video src="${escapeHtml(src)}" controls playsinline preload="metadata"${poster}></video></div>`;
      }
      const embed = videoEmbed(src);
      if (embed) {
        return `<div class="video-wrap${/facebook\.com/.test(src) ? " square" : ""}"><iframe src="${embed}" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; accelerometer; gyroscope" allowfullscreen title="${escapeHtml(w.title)}"></iframe></div>`;
      }
      if (w.cover) return `<div class="hero-cover"><img src="${escapeHtml(w.cover)}" alt="${escapeHtml(w.title)}"></div>`;
      return "";
    }

        client: "",
        cover: "",
        gallery: [],
        video: "",
        link: ""
      };
      content.works.push(w);
      persistLocal();
      location.hash = "#/w/" + w.id;
      saveContent("新增作品").catch(err => toast(err.message));
    }

    function newCatId() {
      let id = "c" + Date.now().toString(36);
      while (catById(id)) id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
      return id;
    }

    function insertBodyText(textarea, text) {
      if (!textarea) return;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const before = textarea.value.slice(0, start);
      const after = textarea.value.slice(end);
      const padBefore = !before ? "" : (before.endsWith("\n\n") ? "" : (before.endsWith("\n") ? "\n" : "\n\n"));
      const padAfter = !after || after.startsWith("\n") ? "" : "\n\n";
      const insertion = padBefore + text + padAfter;
      textarea.value = before + insertion + after;
      const pos = (before + padBefore + text).length;
      textarea.focus();
      textarea.setSelectionRange(pos, pos);
      textarea.dispatchEvent(new Event("input"));
    }

    function bindThisEdit() {
      const btn = $("btnThisEdit");
      if (!btn) return;
      btn.onclick = () => {
        if (editing) return;
        if (ghToken) enterEdit();
        else openPinForm();
      };
    }

    function bindAddButtons(root) {
      if (!root) return;
      root.querySelectorAll("[data-add-work]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          const cat = btn.getAttribute("data-add-work");
          if (cat) addWork(cat);
          else openAddWork();
        });
      });
      root.querySelectorAll("[data-add-cat]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          openAddCat();
        });
      });
      root.querySelectorAll("[data-del-cat]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.preventDefault(); e.stopPropagation();
          confirmDeleteCat(btn.getAttribute("data-del-cat"));
        });
      });
    }

    function openAddWork() {
      const cats = content.categories || [];
      if (!cats.length) {
        toast("請先加一個分類");
        openAddCat();
        return;
      }
      openModal(`
        <h3>新增作品</h3>
        <label class="edit-label">放喺邊個分類</label>
        <select class="field" id="mCat">${cats.map(c =>
          `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join("")}</select>
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">新增</button>
        </div>`);
      $("mCancel").onclick = closeModal;
      $("mOk").onclick = () => {
        const cat = $("mCat").value;
        closeModal();
        addWork(cat);
      };
    }

    function openAddCat() {
      openModal(`
        <h3>新增分類</h3>
        <label class="edit-label">分類名稱</label>
        <input class="field" id="mTitle" maxlength="20" placeholder="例如：專題">
        <label class="edit-label">一句說明（可留空）</label>
        <input class="field" id="mBlurb" maxlength="40" placeholder="例如：專題與企劃">
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">新增</button>
        </div>`);
      $("mTitle").focus();
      $("mCancel").onclick = closeModal;
      const go = () => {
        const title = $("mTitle").value.trim() || "新分類";
        const blurb = $("mBlurb").value.trim();
        content.categories.push({ id: newCatId(), title, blurb });
        closeModal();
        renderNav();
        route();
        saveContent("新增分類").catch(err => toast(err.message));
      };
      $("mOk").onclick = go;
      $("mTitle").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }

    function confirmDeleteCat(id) {
      const c = catById(id);
      if (!c) return;
      const n = worksIn(id).length;
      openModal(`
        <h3>刪除分類</h3>
        <p>確定刪除「${escapeHtml(c.title)}」${n ? `？裏面 ${n} 件作品都會一齊刪` : "？"}</p>
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">刪除</button>
        </div>`);
      $("mCancel").onclick = closeModal;
      $("mOk").onclick = async () => {
        content.categories = content.categories.filter(x => x.id !== id);
        content.works = content.works.filter(x => x.category !== id);
        closeModal();
        if (hashParts()[1] === id) location.hash = "#/";
        else { renderNav(); route(); }
        try { await saveContent("刪除分類"); } catch (err) { toast(err.message); }
      };
    }

    function openSiteForm() {
      const s = site();
      openModal(`
        <h3>網站資料</h3>
        <label class="edit-label">名稱</label>
        <input class="field" id="sName" value="${escapeHtml(s.name || "")}">
        <label class="edit-label">一句介紹</label>
        <input class="field" id="sTag" value="${escapeHtml(s.tagline || "")}">
        <label class="edit-label">關於</label>
        <textarea class="field" id="sAbout">${escapeHtml(s.about || "")}</textarea>
        <label class="edit-label">電郵</label>
        <input class="field" id="sEmail" value="${escapeHtml(s.email || "")}">
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">儲存</button>
        </div>`);
      $("mCancel").onclick = closeModal;
      $("mOk").onclick = async () => {
        content.site.name = $("sName").value.trim() || s.name;
        content.site.tagline = $("sTag").value.trim();
        content.site.about = $("sAbout").value;
        content.site.email = $("sEmail").value.trim();
        closeModal();
        renderNav();
        route();
        try { await saveContent("更新網站資料"); } catch (err) { toast(err.message); }
      };
    }

    function openTokenForm(first) {
      openModal(`
        <h3>${first ? "設定編輯" : "設定上網權限"}</h3>
        <p style="color:var(--muted);font-size:14px;line-height:1.6">密碼用來開編輯。GitHub Token 用來把改動寫上網站。Token 只存在加密檔，唔好公開貼出嚟。</p>
        <label class="edit-label">編輯密碼（至少 4 位）</label>
        <input class="field" id="sPin" type="password" autocomplete="off">
        <label class="edit-label">GitHub Token（repo 權限）</label>
        <input class="field" id="sTok" type="password" autocomplete="off" placeholder="ghp_… 或 github_pat_…">
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">儲存</button>
        </div>`);
      $("mCancel").onclick = closeModal;
      $("mOk").onclick = async () => {
        const pin = $("sPin").value.trim();
        const tok = $("sTok").value.trim();
        if (pin.length < 4) { toast("密碼至少 4 位"); return; }
        if (!/^(gh[pous]_|github_pat_)/.test(tok)) { toast("Token 格式唔對"); return; }
        try {
          ghToken = tok;
          sessionStorage.setItem("ff-gh", tok);
          const gate = await encryptToken(pin, tok);
          const text = JSON.stringify(gate, null, 2) + "\n";
          await ghPut("gate.json", text, "更新編輯權限");
          closeModal();
          enterEdit();
          toast("已設定");
        } catch (err) { toast(err.message); }
      };
    }

    function openPinForm() {
      openModal(`
        <h3>編輯</h3>
        <label class="edit-label">請輸入編輯密碼</label>
        <input class="field" id="sPin" type="password" autocomplete="off">
        <div class="row">
          <button class="btn ghost" type="button" id="mCancel">取消</button>
          <button class="btn accent" type="button" id="mOk">進入</button>
        </div>
        <p style="margin:14px 0 0;font-size:13px;color:var(--muted)">第一次？<button type="button" class="btn ghost" id="mSetup" style="margin-left:8px">設定密碼同 Token</button></p>`);
      $("sPin").focus();
      $("mCancel").onclick = closeModal;
      $("mSetup").onclick = () => openTokenForm(true);
      const go = async () => {
        const pin = $("sPin").value.trim();
        if (!pin) { toast("請輸入密碼"); return; }
        try {
          const res = await fetch("gate.json", { cache: "no-store" });
          if (!res.ok) throw new Error("尚未設定");
          const gate = await res.json();
          if (gate.repo) GH_REPO = gate.repo;
          ghToken = await decryptToken(pin, gate);
          sessionStorage.setItem("ff-gh", ghToken);
          closeModal();
          enterEdit();
        } catch (err) {
          toast(err.message === "尚未設定" ? "請先設定密碼同 Token" : "密碼不正確");
        }
      };
      $("mOk").onclick = go;
      $("sPin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }

    function enterEdit() {
      editing = true;
      document.body.classList.add("editing");
      $("btnEdit").textContent = "完成";
      route();
    }
    async function exitEdit() {
      clearTimeout(saveTimer);
      try { await saveContent("完成編輯"); } catch (err) { toast(err.message); }
      editing = false;
      document.body.classList.remove("editing");
      $("btnEdit").textContent = "編輯";
      route();
    }

    function route() {
      if (!content) return;
      renderNav();
      window.scrollTo(0, 0);
      const parts = hashParts();
      if (parts[0] === "c" && parts[1]) return renderCategory(parts[1]);
      if (parts[0] === "w" && parts[1]) return renderWork(parts[1]);
      if (parts[0] === "about") return renderAbout();
      renderHome();
    }

    $("btnEdit").addEventListener("click", () => {
      if (editing) exitEdit();
      else if (ghToken) enterEdit();
      else openPinForm();
    });
    $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
    window.addEventListener("hashchange", route);

    async function boot() {
      try {
        const local = localStorage.getItem("ff-content");
        if (local) content = JSON.parse(local);
      } catch (_) {}
      try {
        const res = await fetch("content.json?v=20260920&t=" + Date.now(), { cache: "no-store" });
        if (res.ok) content = await res.json();
      } catch (_) {}
      if (!content) content = DEFAULT_CONTENT;
      if (!Array.isArray(content.categories)) content.categories = DEFAULT_CONTENT.categories;
      if (!Array.isArray(content.works)) content.works = [];
      if (!content.site) content.site = DEFAULT_CONTENT.site;
      try {
        const g = await fetch("gate.json", { cache: "no-store" });
        if (g.ok) {
          const gate = await g.json();
          if (gate.repo) GH_REPO = gate.repo;
        }
      } catch (_) {}
      route();
    }
    boot();
  </script>
</body>
</html>
